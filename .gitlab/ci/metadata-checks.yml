stages:
- metadata-check

variables:
  PYTHON_IMAGE: "python:3.13-slim"

# ============================================================
# REUSE — Vérification des licences et identifiants SPDX
# ============================================================
reuse-lint:
  stage: metadata-check
  image:
    name: fsfe/reuse:latest
    entrypoint: [ "" ]
  script:
  - reuse lint

# ============================================================
# CITATION.CFF — Validation des métadonnées de citation
# ============================================================
cff-validate:
  stage: metadata-check
  image:
    name: citationcff/cffconvert:latest
    entrypoint: [ "" ]
  script:
  - cffconvert --validate -i CITATION.cff

# ============================================================
# CODEMETA — Validation JSON et expansion JSON-LD
# ============================================================
codemeta-validate:
  stage: metadata-check
  image: $PYTHON_IMAGE
  script:
  # Install JSON-LD processor
  - pip install --no-cache-dir pyld

  # Check JSON syntax
  - python -m json.tool codemeta.json > /dev/null

  # Check JSON-LD expansion
  - python -c "import json; from pyld import jsonld; doc=json.load(open('codemeta.json', encoding='utf-8')); jsonld.expand(doc); print('CodeMeta JSON-LD: OK')"
