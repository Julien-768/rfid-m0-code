# .gitlab-ci.yml
#
# GitLab CI configuration for the "rfid.code" project.
#
# Covered steps:
#  - Code formatting checks (clang-format)
#  - Firmware build using PlatformIO
#  - Documentation generation (Doxygen)
#  - Versioning and release (tag + archive + GitLab release)

# --------------------------------------------------
# Include reusable CI templates from IPHC
# --------------------------------------------------
include:

# --- Clang-format code style check stage ---
- project: 'iphc/ci-templates'
  file: '/templates/clang/template.yml'
  ref: 'develop'

# --- PlatformIO build stage ---
- project: 'iphc/ci-templates'
  file: '/templates/platformio/template.yml'
  ref: 'develop'
  inputs:
    environments: "clangtidy"
    project_dir: "."
    project_conf: "platformio.ini"

# --- Doxygen documentation generation stage ---
- project: 'iphc/ci-templates'
  file: '/templates/doxygen/template.yml'
  ref: 'develop'
  inputs:
    doxyfile_path: "."

# --- Deploy stage ---
- project: 'iphc/ci-templates'
  file: "templates/github-sync/template.yml"
  ref: 'develop'
  inputs:
    branches: "develop|main|metadata"
    github_repo: "Julien-768/rfid-m0-code"
    stage: deploy

# --- Release stage ---
- project: 'iphc/ci-templates'
  file: '/templates/release/template.yml'
  ref: 'develop'

variables:
  # --------------------------------------------------
  # Project-specific variables used by the CI templates
  # --------------------------------------------------
  # Clang-format configuration
  CLANG_FORMAT_FILE: .clang-format
  CLANG_PATH: "src"
  # PlatformIO configuration:
  PIO_ENV: "clangtidy"
  # --------------------------------------------------
  # Pipeline stages
  #
  # Order reflects a standard validation flow:
  #  - format: code style checks
  #  - build: firmware compilation
  #  - pages: documentation generation
  #  - release: versioning and publication
  # --------------------------------------------------
stages:
- prepare
- format
- build
- pages
- deploy
- release

generate_fw_version:
  stage: prepare
  rules:
  - if: '$CI_COMMIT_TAG'
  script:
  - mkdir -p include/app
  - |
    cat > include/app/fw_version.h <<EOF
    /**
     * @file fw_version.h
     * @brief Auto-generated firmware version definitions.
     *
     * Generated by GitLab CI from tag and commit metadata.
     */

    #pragma once

    #define FW_VERSION_STRING "${CI_COMMIT_TAG}"
    #define FW_GIT_HASH "${CI_COMMIT_SHORT_SHA}"
    #define FW_BUILD_DATE "${CI_JOB_STARTED_AT}"
    EOF
  artifacts:
    paths:
    - include/app/fw_version.h

clang-tidy:
  extends: .clang-tidy-template
  stage: format
  allow_failure: true

pio-build:
  extends: .platformio-build-template
  needs:
  - job: generate_fw_version
    artifacts: true
    optional: true
  rules:
  - exists:
    - platformio.ini
  - when: never

# ---------------------------------------------------------------------------
# Prerequisite: GITLAB_API_TOKEN
#
# Create a project access token:
#   1. Open Settings > Access Tokens.
#   2. Create a token named "sync-gitlab-description".
#      Description: Allows GitLab CI/CD to synchronize the project description from codemeta.json via the GitLab API.
#   3. Set the role to Maintainer and the scope to api.
#   4. Set an expiration date and create the token.
#   5. Copy the token immediately; it cannot be viewed again later.
#
# Store the token as a CI/CD variable:
#   1. Open Settings > CI/CD > Variables.
#   2. Add a variable with the following settings:
#        Description:       Project access token used by the CI/CD pipeline to synchronize the GitLab project description from codemeta.json via the GitLab API
#        Key:               GITLAB_API_TOKEN
#        Value:             <the generated access token>
#        Type:              Variable
#        Visibility:        Masked (or Masked and hidden, if available)
#        Environment scope: *
#        Protected:         Enable only if the default branch is protected.
#   3. Save the variable.
#
# Security:
#   - Never commit the token to the repository.
#   - Never print the token in CI job logs.
#   - Renew the token and update this CI/CD variable before it expires.
#
# Documentation:
#   https://docs.gitlab.com/user/project/settings/project_access_tokens/
#   https://docs.gitlab.com/ci/variables/
# ---------------------------------------------------------------------------

sync_gitlab_description:
  stage: .post
  image: python:3.12-slim

  rules:

  # Allow a manual test by setting FORCE_SYNC=true.
  - if: '$FORCE_SYNC == "true"'

  - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    changes:
    - codemeta.json
    - .gitlab/scripts/sync_gitlab_description.py

  script:
  - python .gitlab/scripts/sync_gitlab_description.py
