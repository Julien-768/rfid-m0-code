# .gitlab-ci.yml
#
# GitLab CI configuration for the "rfid.code" project.

spec:
  inputs:
    # PlatformIO
    environments:
      description: "PlatformIO environments to build"
      default: "clangtidy"
      type: string

    project_dir:
      description: "Directory containing the PlatformIO project"
      default: "."
      type: string

    project_conf:
      description: "PlatformIO configuration file"
      default: "platformio.ini"
      type: string

    # Doxygen
    doxyfile_path:
      description: "Directory containing the Doxyfile"
      default: "."
      type: string

    # GitHub synchronization
    branches:
      description: "Branches to synchronize with GitHub, separated by |"
      default: "develop|main|metadata"
      type: string

    github_repo:
      description: "GitHub repository (owner/repository)"
      default: "Julien-768/rfid-m0-code"
      type: string

    sync_stage:
      description: "Pipeline stage for GitHub synchronization"
      default: "deploy"
      options:
      - deploy
      type: string
---

# --------------------------------------------------
# Include reusable CI templates from IPHC
# --------------------------------------------------

include:

# --- Clang-format code style check stage ---
- project: 'iphc/ci-templates'
  file: '/templates/clang/template.yml'
  ref: 'develop'

# --- PlatformIO build stage ---
- project: 'iphc/ci-templates'
  file: '/templates/platformio/template.yml'
  ref: 'develop'
  inputs:
    environments: "$[[ inputs.environments ]]"
    project_dir: "$[[ inputs.project_dir ]]"
    project_conf: "$[[ inputs.project_conf ]]"

# --- Doxygen documentation generation stage ---
- project: 'iphc/ci-templates'
  file: '/templates/doxygen/template.yml'
  ref: 'develop'
  inputs:
    doxyfile_path: "$[[ inputs.doxyfile_path ]]"

# --- Deploy stage ---
- project: 'iphc/ci-templates'
  file: '/templates/github-sync/template.yml'
  ref: 'gitlab-MR-template'
  inputs:
    branches: "$[[ inputs.branches ]]"
    github_repo: "$[[ inputs.github_repo ]]"
    stage: "$[[ inputs.sync_stage ]]"

# --- Release stage ---
- project: 'iphc/ci-templates'
  file: '/templates/release/template.yml'
  ref: 'develop'

# --------------------------------------------------
# CI/CD variables
# --------------------------------------------------

variables:
  FORCE_SYNC:
    value: "false"
    description: "Force synchronization of GitLab project description and topics"
    options:
    - "false"
    - "true"

  # Clang-format configuration
  CLANG_FORMAT_FILE:
    value: ".clang-format"
    description: "Path to the clang-format configuration file"

  CLANG_PATH:
    value: "src"
    description: "Directory or directories scanned by clang-format"

  # PlatformIO configuration
  PIO_ENV:
    value: "clangtidy"
    description: "PlatformIO environment used by the clang-tidy job"

# --------------------------------------------------
# Pipeline stages
# --------------------------------------------------

stages:
- prepare
- format
- build
- pages
- deploy
- release

# --------------------------------------------------
# Firmware version generation
# --------------------------------------------------

generate_fw_version:
  stage: prepare
  rules:
  - if: '$CI_COMMIT_TAG'
  script:
  - mkdir -p include/app
  - |
    cat > include/app/fw_version.h <<EOF
    /**
     * @file fw_version.h
     * @brief Auto-generated firmware version definitions.
     *
     * Generated by GitLab CI from tag and commit metadata.
     */

    #pragma once

    #define FW_VERSION_STRING "${CI_COMMIT_TAG}"
    #define FW_GIT_HASH "${CI_COMMIT_SHORT_SHA}"
    #define FW_BUILD_DATE "${CI_JOB_STARTED_AT}"
    EOF
  artifacts:
    paths:
    - include/app/fw_version.h

# --------------------------------------------------
# Code quality
# --------------------------------------------------

clang-tidy:
  extends: .clang-tidy-template
  stage: format
  allow_failure: true

# --------------------------------------------------
# Firmware build
# --------------------------------------------------

pio-build:
  extends: .platformio-build-template
  needs:
  - job: generate_fw_version
    artifacts: true
    optional: true
  rules:
  - exists:
    - platformio.ini
  - when: never

# --------------------------------------------------
# GitLab project metadata synchronization
#
# Required CI/CD variable:
#   GITLAB_API_TOKEN
# --------------------------------------------------

gitlab_project_metadata:
  stage: .post
  image: python:3.12-slim

  rules:
  # Allow a manual test by setting FORCE_SYNC=true.
  - if: '$FORCE_SYNC == "true"'

  - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    changes:
    - codemeta.json
    - .gitlab/scripts/sync_gitlab_description.py

  script:
  - python .gitlab/scripts/sync_gitlab_description.py
  - python .gitlab/scripts/sync_gitlab_topics.py
