variables:
  GITHUB_REPOSITORY: "Julien-768/rfid-m0-code"

sync_to_github:
  image: alpine:latest

  script:
  - apk add --no-cache git
  - git remote add github "https://${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
  - git push github "HEAD:${CI_COMMIT_BRANCH}"

  only:
  - main
  - develop
  - test_github_sync
